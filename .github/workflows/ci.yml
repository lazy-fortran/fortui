name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semantic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran curl
          curl -L https://github.com/fortran-lang/fpm/releases/download/v0.10.0/fpm-0.10.0-linux-x86_64 -o fpm
          chmod +x fpm
          sudo mv fpm /usr/local/bin/

      - name: Build
        env:
          FPM_FFLAGS: "-g -fbacktrace -fcheck=all -Wall -Wextra -Wimplicit-interface -cpp"
          FORTUI_HEADLESS: "1"
        run: fpm build

      - name: Test semantic core
        env:
          FPM_FFLAGS: "-g -fbacktrace -fcheck=all -Wall -Wextra -Wimplicit-interface -cpp"
          FORTUI_HEADLESS: "1"
        run: fpm test

      - name: Enforce backend boundary
        run: |
          if grep -E "use[[:space:]]+fortui_(tui|gui|backend_headless)" \
            src/fortui_widgets.f90 src/fortui_core.f90 src/fortui_context.f90 \
            src/fortui_frame.f90 src/fortui_input.f90 src/fortui_layout.f90 \
            src/fortui_text.f90 src/fortui_canvas.f90 src/fortui.f90; then
            echo "Widgets/runtime must not depend on concrete platform backends"
            exit 1
          fi
          if grep -E "use[[:space:]]+fortui_backend" src/fortui_widgets.f90; then
            echo "Widgets must not depend on the backend interface"
            exit 1
          fi

      - name: Reject stale architecture
        run: |
          ! grep -R "type[[:space:]]*::[[:space:]]*node" src/fortui_layout.f90
          ! grep -R "class(\\*)" src
