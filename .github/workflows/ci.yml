name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semantic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran curl
          curl -L https://github.com/fortran-lang/fpm/releases/download/v0.10.0/fpm-0.10.0-linux-x86_64 -o fpm
          chmod +x fpm
          sudo mv fpm /usr/local/bin/

      - name: Build
        env:
          FPM_FFLAGS: "-g -fbacktrace -fcheck=all -Wall -Wextra -Wimplicit-interface -cpp"
          FORTUI_HEADLESS: "1"
        run: fpm build

      - name: Test semantic core
        env:
          FPM_FFLAGS: "-g -fbacktrace -fcheck=all -Wall -Wextra -Wimplicit-interface -cpp"
          FORTUI_HEADLESS: "1"
        run: fpm test

      - name: Enforce backend boundary
        run: |
          runtime="src/fortui.f90 src/fortui_core.f90 src/fortui_widgets.f90
            src/fortui_context.f90 src/fortui_frame.f90 src/fortui_input.f90
            src/fortui_layout.f90 src/fortui_text.f90 src/fortui_canvas.f90
            src/fortui_backend.f90 src/fortui_testing.f90"
          # Core, widgets and the facade know no concrete backend and do not
          # need the optional registry (applications inject a backend).
          if grep -nE "use[[:space:]]+fortui_(tui|gui|backend_headless|backends)\b" \
            $runtime; then
            echo "Runtime modules must not depend on concrete backends or the registry"
            exit 1
          fi
          if grep -nE "use[[:space:]]+fortui_backend\b" src/fortui_widgets.f90 \
            src/fortui_layout.f90 src/fortui_frame.f90 src/fortui_canvas.f90; then
            echo "Widgets and layout must not depend on the backend interface"
            exit 1
          fi
          # Only the registry names more than one backend.
          for f in src/*.f90; do
            n=$(grep -cE "use[[:space:]]+fortui_(tui|gui_raylib|gui_sdl|backend_headless)\b" "$f" || true)
            if [ "$n" -gt 1 ] && [ "$f" != src/fortui_backends.f90 ]; then
              echo "$f names several concrete backends"; exit 1
            fi
          done

      - name: Reject stale architecture
        run: |
          ! grep -R "type[[:space:]]*::[[:space:]]*node" src/fortui_layout.f90
          ! grep -R "class(\\*)" src
