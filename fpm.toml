name = "fortui"
version = "0.1.0"
license = "license"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Christopher Albert"

# Test re-enabling examples one by one
[[example]]
name = "simple_test"
source-dir = "example"
main = "simple_test.f90"

[[example]]
name = "button_layout_demo"
source-dir = "example"
main = "button_layout_demo.f90"

[[example]]
name = "layout_demo"
source-dir = "example"
main = "layout_demo.f90"

[[example]]
name = "tui_rendering_demo"
source-dir = "example"
main = "tui_rendering_demo.f90"

[[example]]
name = "test_context_validation"
source-dir = "example"
main = "test_context_validation.f90"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = false
test = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["F90", "f90"]
cpp.directories = ["src", "app", "test", "example"]
# Macros are set dynamically by build script via FPM_FFLAGS
cpp.macros = []

# Build script integration:
# - tools/fpm_build_wrapper.sh is executed before compilation
# - Sets FPM_FFLAGS with CPP macros (ENABLE_GUI or TUI_ONLY)
# - Sets FPM_LDFLAGS with dependency paths and libraries
# - Manages termbox2 and fortran-raylib dependencies automatically


