name = "fortui"
version = "0.2.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025-2026, Christopher Albert"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["F90", "f90"]
cpp.directories = ["src", "app", "test", "example"]

[dependencies]
fortzip = { git = "https://github.com/lazy-fortran/fortzip.git", rev = "4353df1767953a8d38ce68fec04c98098a13a5ff" }
fortimg = { git = "https://github.com/lazy-fortran/fortimg.git", rev = "22716c3ed5424e1e463bde5e6bc0daf40d78cb2e" }
fortfont = { git = "https://github.com/lazy-fortran/fortfont.git", rev = "7d53dd0dd5f88897dfa531b86287a01b934c2ed7" }
fortwin = { git = "https://github.com/lazy-fortran/fortwin.git", rev = "3ac4792f61e2d6a043d8d3302e8700775e275a64" }
fortgfx = { git = "https://github.com/lazy-fortran/fortgfx.git", rev = "21cdc328979113e234a71a66837a93611f1072ab" }

[features]
platform.macos.preprocess.cpp.macros = ["__APPLE__"]
platform.windows.preprocess.cpp.macros = ["_WIN32"]

[profiles]
default = ["platform"]
