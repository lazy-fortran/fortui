name = "fortui"
version = "0.1.0"
license = "license"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Christopher Albert"

# Test re-enabling examples one by one
[[example]]
name = "simple_test"
source-dir = "example"
main = "simple_test.f90"

[[example]]
name = "button_layout_demo"
source-dir = "example"
main = "button_layout_demo.f90"

[[example]]
name = "layout_demo"
source-dir = "example"
main = "layout_demo.f90"

[[example]]
name = "tui_rendering_demo"
source-dir = "example"
main = "tui_rendering_demo.f90"

[[example]]
name = "tui_demo"
source-dir = "example"
main = "tui_demo.f90"


[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

# Minimal preprocessing - only for essential backend selection
[preprocess]
cpp.suffixes = ["F90", "f90"]
cpp.directories = ["src", "app", "test", "example"]
# TUI backend always enabled, GUI optional via DISABLE_GUI environment variable
cpp.macros = ["ENABLE_TUI=1"]

# C source compilation - FPM automatically compiles C files in src/
# The termbox2.c and termbox2.h files will be compiled and linked automatically

# Simple build process:
# fpm build                    - builds project with embedded termbox2
# fpm run --example simple_test  - runs simple example directly
# fmp test                    - runs tests

