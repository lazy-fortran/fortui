name = "fortui"
version = "0.2.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025-2026, Christopher Albert"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["F90", "f90"]
cpp.directories = ["src", "app", "test", "example"]

[dependencies]
fortzip = { git = "https://github.com/lazy-fortran/fortzip.git", rev = "4353df1767953a8d38ce68fec04c98098a13a5ff" }
fortimg = { git = "https://github.com/lazy-fortran/fortimg.git", rev = "22716c3ed5424e1e463bde5e6bc0daf40d78cb2e" }
fortfont = { git = "https://github.com/lazy-fortran/fortfont.git", rev = "32c1303827b357d94e6bb428824732188ca79ff2" }
fortwin = { git = "https://github.com/lazy-fortran/fortwin.git", rev = "4efc834788d68a9458678e57520596465518099e" }
fortgfx = { git = "https://github.com/lazy-fortran/fortgfx.git", rev = "872b0886ce139f48fae3727e48d465edcc8a7a0e" }
