[[example]]
name = "simple_test"
source-dir = "examples"
main = "simple_test.f90"

[[example]]  
name = "layout_demo"
source-dir = "examples"
main = "layout_demo.f90"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
[install]
library = false
test = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

