name = "fortui"
version = "0.1.0"
license = "license"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Christopher Albert"

[[example]]
name = "tui_demo"
source-dir = "example"
main = "tui_demo.f90"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["F90", "f90"]
cpp.directories = ["src", "app", "test", "example"]
cpp.macros = ["ENABLE_TUI=1"]
