<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FortUI web demo</title>
<link rel="stylesheet" href="fortui.css">
<style>
  html, body { margin: 0; height: 100%; background: #fbfbf8; color: #1d1f21; }
  #app { position: absolute; top: 0; left: 0; right: 0; min-height: 100%; }
  .fui[data-tone="1"] { color: #2f7d4f; } .fui[data-tone="2"] { color: #b23a3a; }
  .fui-k2, .fui-k5 { border: 1px solid #c9c6bb; border-radius: 6px; background: #fff; }
  .fui-k5[aria-selected="true"] { border-color: #3b6e5a; color: #3b6e5a; }
  .fui-hover { background: #f0efe9; }
  .fui-focus { outline: 2px solid #3b6e5a; outline-offset: 1px; }
  .fui-k8 { border: 1px solid #c9c6bb; border-radius: 4px; padding: 0 6px; }
  .fui-k4 { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="web_demo.js"></script>
</body>
</html>
